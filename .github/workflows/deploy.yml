name: Deploy to GitHub Pages with "Obraz" (https://obraz.pirx.ru/) Static Site Generator

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install python modules
        run: |
          pip3 install --break-system-packages PyYAML jinja2 markdown docopt

      - name: Run build script via Make
        run: |
          python3 obraz.py build -d /tmp/output-www/
          (cd /tmp/output-www/; rm -f offline.tar.xz; tar -chJf ../offline.tar.xz .; mv ../offline.tar.xz .)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/output-www/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
